name: Test and build Windows launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py' -v
      - run: python -m pip install -r requirements-build.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PZModLauncher-Windows
          path: dist/PZModLauncher.exe
